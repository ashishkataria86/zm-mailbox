# Zimbra sudoers fragment — Postfix command restrictions
#
# SECURITY: Do NOT grant sudo access to the real postconf or postfix binaries
# directly. The wrapper scripts validate arguments before delegating, preventing
# privilege escalation via daemon_directory redirection (CVE-style: local
# zimbra user → root via postfix set-permissions).
#
# Deploy this file to /etc/sudoers.d/zimbra-postfix (chmod 440, owned root:root)
# and remove any existing bare entries for postconf or postfix.
#
# Wrappers must be installed to the paths below and owned root:root, chmod 755.

Defaults!zimbra_postconf !requiretty
Defaults!zimbra_postfix  !requiretty

# Allow zimbra to run the postconf wrapper (read queries + safe writes only).
# The wrapper blocks writes to daemon_directory and other path parameters.
Cmnd_Alias ZIMBRA_POSTCONF = /opt/zimbra/common/libexec/zmpostconf-wrapper.sh

# Allow zimbra to run the postfix wrapper (start/stop/reload only).
# The wrapper blocks set-permissions and all other execution-triggering subcommands.
Cmnd_Alias ZIMBRA_POSTFIX = /opt/zimbra/common/libexec/zmpostfix-wrapper.sh

zimbra ALL=(root) NOPASSWD: ZIMBRA_POSTCONF *
zimbra ALL=(root) NOPASSWD: ZIMBRA_POSTFIX *
